<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAY的小遊戲</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#5a3d2b;min-height:100vh;
  background:repeating-conic-gradient(#ffe2c2 0 25%,#fff4e6 0 50%) 0 0/64px 64px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
h1{margin:0;font-size:36px;color:#e8743b;text-shadow:3px 3px 0 #fff}
.icon-btn{font-size:28px;background:#fff;border:3px solid #f0b27a;border-radius:16px;width:58px;height:58px;cursor:pointer}
.screen{display:none;padding:6px 16px 30px;max-width:900px;margin:0 auto}
.screen.on{display:block}
.hello{text-align:center;font-size:28px;font-weight:bold;margin:6px 0 14px;background:#fffc;border-radius:20px;padding:8px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
#menu{max-width:1000px}
.card{background:#fff;border:4px solid #f6c28b;border-radius:28px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;font-size:26px;font-weight:bold;box-shadow:0 6px 0 #f0a868;white-space:nowrap;transition:transform .1s}
.card:hover{transform:translateY(-3px)}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 #f0a868}
.card .best{font-size:20px;color:#b07a4f;font-weight:normal;min-height:26px}
.mini{width:108px;height:108px;position:relative}
.mini>.plate{position:absolute;left:0;top:0;transform:scale(.45);transform-origin:0 0}

.dish-name{text-align:center;font-size:22px;color:#b07a4f;font-weight:bold}
.say{background:#fff;border-radius:24px;padding:14px 20px;font-size:30px;font-weight:bold;text-align:center;border:4px solid #8fd3a8;margin:6px auto 4px;max-width:660px;cursor:pointer}
.stage{height:345px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ware{position:relative}
.dots{text-align:center;font-size:28px;height:36px;letter-spacing:6px;color:#ff8a4c}
.action{display:block;margin:6px auto 0;font-size:36px;font-weight:bold;padding:16px 40px;border-radius:999px;border:none;background:#ff8a4c;color:#fff;box-shadow:0 7px 0 #d9622a;cursor:pointer;animation:pulse 1.2s infinite;min-width:250px;font-family:inherit}
.action:active{transform:translateY(5px);box-shadow:0 2px 0 #d9622a}
.action:disabled{background:#c9b8a8;box-shadow:0 7px 0 #a8968a;animation:none;cursor:default}
.action.alt{background:#5fb8e8;box-shadow:0 7px 0 #3a8fc0}
@keyframes pulse{50%{transform:scale(1.06)}}
.bump{animation:bump .3s}
@keyframes bump{30%{transform:rotate(-6deg) scale(1.05)}70%{transform:rotate(5deg)}}

.meter{position:relative;height:44px;max-width:540px;margin:2px auto 14px;border-radius:22px;overflow:hidden;display:flex;border:4px solid #fff;box-shadow:0 0 0 3px #e0c4a8}
.meter>div:not(.needle){display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:bold}
.needle{position:absolute;top:0;bottom:0;width:8px;background:#5a3d2b;border-radius:4px;left:-4px}
.wait{height:26px;max-width:420px;margin:2px auto 14px;background:#fff;border-radius:13px;overflow:hidden;border:3px solid #e0c4a8}
.wait>div{height:100%;width:0;background:#8fd3a8}

/* 平底鍋 */
.pan{width:250px;height:250px;border-radius:50%;background:radial-gradient(circle at 45% 40%,#5d5d5d,#2a2a2a 70%);border:12px solid #1d1d1d;position:relative;margin-right:120px}
.pan::after{content:"";position:absolute;left:100%;top:50%;width:120px;height:30px;margin-left:10px;transform:translateY(-50%);background:linear-gradient(#8b5a2b,#5e3a17);border-radius:15px}
.hot{box-shadow:0 0 0 6px rgba(255,140,0,.35),0 0 40px 18px rgba(255,100,0,.45)}
.flames{position:absolute;left:0;bottom:-36px;text-align:center;font-size:30px;animation:flick .25s infinite alternate}
@keyframes flick{to{transform:scaleY(1.15) translateY(-3px)}}
.oil{position:absolute;inset:30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,240,150,.6),rgba(255,215,90,.2) 60%,transparent 75%)}

/* 荷包蛋 */
.fe{position:absolute;transform:translate(-50%,-50%)}
.fe .white{width:160px;height:140px;border-radius:52% 48% 46% 54%/56% 44% 56% 44%;background:#fff;box-shadow:inset 0 0 8px 3px #f3d9a0}
.fe .yolk{position:absolute;left:50%;top:48%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0 0 12%,#ffb300 32%,#ff9800)}
.fe.raw .white{background:rgba(255,255,255,.4);box-shadow:none}
.fe.full .yolk{background:radial-gradient(circle at 35% 30%,#ffe9a0,#f6c445)}
.fe.burnt .white{box-shadow:inset 0 0 24px 16px #5b3412}
.fe.burnt .yolk{background:#c9962a}
.fe.sm{transform:translate(-50%,-50%) scale(.6)}

/* 碗 */
.bowl{width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#fff 0 50%,#cfe6ff 78%);border:12px solid #7fb8ea;position:relative;overflow:hidden;box-shadow:0 8px 0 #5c97cc}
.bowl.sm{width:150px;height:150px;border-width:8px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 4px 8px rgba(0,0,0,.3)}
.beaten{position:absolute;inset:20px;border-radius:50%}
.bowl.sm .beaten{inset:12px}
.beaten.set{background:radial-gradient(circle at 40% 35%,#fff8d0,#ffe08a 70%,#f8cf62)}
.scal{position:absolute;width:10px;height:10px;border-radius:50%;background:#5cb85c;border:2px solid #3e8e3e}

/* 炒蛋 */
.liquid{position:absolute;inset:38px;border-radius:48% 52% 50% 50%;background:rgba(255,200,40,.92)}
.curd{position:absolute;width:46px;height:36px;transform:translate(-50%,-50%) rotate(var(--r));background:radial-gradient(circle at 40% 35%,#fff3a6,#ffd54f 60%,#f2b632);border-radius:45% 55% 40% 60%/55% 40% 60% 45%}

/* 湯鍋 */
.pot{width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#eef2f4,#b8c5cc);border:14px solid #8a9ba5;position:relative}
.pot::before,.pot::after{content:"";position:absolute;top:50%;width:46px;height:28px;margin-top:-14px;background:#444;border-radius:12px}
.pot::before{right:100%;margin-right:8px}
.pot::after{left:100%;margin-left:8px}
.water{position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#dff3ff,#79c3f2);overflow:hidden}
.bub{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.95);animation:bub .9s infinite;transform:scale(0)}
@keyframes bub{0%{transform:scale(.2);opacity:1}80%{transform:scale(1.2);opacity:1}100%{transform:scale(1.5);opacity:0}}
.shell{position:absolute;width:58px;height:74px;transform:translate(-50%,-50%) rotate(var(--r));border-radius:50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fff,#f5e6d0 70%,#e8cfae);box-shadow:0 3px 5px rgba(0,0,0,.25)}
.lid{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.9),rgba(205,218,226,.92) 60%,rgba(150,170,180,.95));border:6px solid #8a9ba5;z-index:3}
.knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:#5a3d2b;box-shadow:inset 0 -6px 0 #3e2a1d}
.steam{position:absolute;font-size:44px;animation:steam 1.8s infinite;z-index:4;opacity:0}
@keyframes steam{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.95}100%{transform:translateY(-130px) scale(1.4);opacity:0}}

/* 剝殼 */
.board{width:310px;height:240px;background:linear-gradient(#e2b47c,#c98f4f);border-radius:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 #a26d35}
.bigegg{width:150px;height:190px;border-radius:50%/60% 60% 40% 40%;position:relative;overflow:hidden;background:radial-gradient(circle at 38% 30%,#fff,#f7f3ee 70%,#e6dfd6);box-shadow:0 8px 10px rgba(0,0,0,.25)}
.slice{position:absolute;top:0;bottom:0;width:21%;background:radial-gradient(circle at 50% 30%,#f2d3a6,#d6a466);border-right:3px dashed #b48a5a}

/* 盤子 */
.plate{width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#fff 0 56%,#ececec 59%,#fff 70%,#e3e3e3);box-shadow:0 8px 0 #d8cfc4,0 12px 20px rgba(0,0,0,.15);position:relative}
.bhalf{position:absolute;width:80px;height:104px;border-radius:50%/60% 60% 40% 40%;background:#fff;box-shadow:0 3px 5px rgba(0,0,0,.2);transform:translate(-50%,-50%) rotate(var(--r))}
.bhalf::after{content:"";position:absolute;left:50%;top:52%;width:44px;height:44px;margin:-22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe58a,#ffbf2e)}

.stars{text-align:center;font-size:56px;color:#ffb300;margin-top:6px}
.msg{text-align:center;font-size:32px;font-weight:bold;margin:4px 0}
/* 小貓咪 */
#feed{display:flex;justify-content:center;align-items:center;gap:90px;height:330px;position:relative}
#feedPlate{cursor:grab;touch-action:none;position:relative;z-index:5}
#feedPlate.wiggle{animation:invite 1.4s infinite}
#feedPlate.dragging{cursor:grabbing;filter:drop-shadow(0 14px 12px rgba(0,0,0,.25))}
#catbox{position:relative;width:250px;height:290px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#cat{width:220px;height:264px;cursor:pointer;position:relative;z-index:2;transition:transform .2s;transform-origin:50% 100%}
#cat svg{width:100%;height:100%;overflow:visible;display:block}
#cat .v{display:none}
#cat[data-mood=idle]  .eyes-open, #cat[data-mood=idle]  .mouth-smile,
#cat[data-mood=smell] .eyes-happy,#cat[data-mood=smell] .mouth-open,
#cat[data-mood=chew]  .eyes-happy,#cat[data-mood=chew]  .mouth-chew,
#cat[data-mood=love]  .eyes-heart,#cat[data-mood=love]  .mouth-open,
#cat[data-mood=happy] .eyes-happy,#cat[data-mood=happy] .mouth-smile{display:inline}
#cat .tail{transform-origin:150px 205px;animation:wag 1.6s ease-in-out infinite}
#cat[data-mood=love] .tail,#cat[data-mood=happy] .tail,#cat[data-mood=smell] .tail{animation-duration:.45s}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
#cat .blink{transform-origin:100px 92px;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#cat .mouth-chew ellipse{transform-origin:100px 121px;animation:munch .3s infinite}
@keyframes munch{50%{transform:scaleY(.3)}}
#cat .ear-l{transform-origin:70px 60px;animation:ear 3s infinite}
@keyframes ear{0%,90%,100%{transform:rotate(0)}95%{transform:rotate(-12deg)}}
#catbox.over #cat{transform:scale(1.12)}
#cat.chew{animation:chew .3s infinite}
#cat.happy{animation:hop .45s 4}
@keyframes chew{50%{transform:scaleY(.9) scaleX(1.05)}}
@keyframes hop{50%{transform:translateY(-30px) rotate(-5deg)}}
.cushion{width:230px;height:48px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#f8bbd0,#f48fb1);margin-top:-36px;box-shadow:0 6px 0 #d86c93}
#bubble{position:absolute;top:-24px;right:-120px;background:#fff;border-radius:22px;padding:8px 16px;font-size:24px;font-weight:bold;border:3px solid #f6c28b;white-space:nowrap;z-index:3;display:none}
#bubble::after{content:"";position:absolute;left:22px;bottom:-14px;border:8px solid transparent;border-top-color:#f6c28b}
.heart{position:absolute;font-size:38px;animation:rise 1.7s ease-out forwards;pointer-events:none;z-index:4}
@keyframes rise{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translateY(-170px) scale(1.2);opacity:0}}
#result{display:none}

/* ---------- 草莓生日蛋糕 ---------- */
.sugar,.flour{position:absolute;left:50%;top:50%;width:80px;height:56px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 35%,#eeeeee);box-shadow:0 3px 6px rgba(0,0,0,.12)}
.sugar{background:radial-gradient(circle at 30% 30%,#fff 0 3px,transparent 4px) 0 0/12px 12px,radial-gradient(circle,#fdfdfd 40%,#e8e8e8)}
.flour{width:100px;height:66px;top:44%;background:radial-gradient(circle at 40% 35%,#fffdf5 40%,#efe6d2)}
.foam{position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0 6px,transparent 7px) 0 0/28px 28px,radial-gradient(circle at 70% 60%,#fffdf5 0 5px,transparent 6px) 0 0/22px 22px}
.mold{width:260px;height:110px;background:linear-gradient(90deg,#90a4ae,#eceff1 40%,#b0bec5);border:4px solid #78909c;border-radius:8px 8px 18px 18px;position:relative;overflow:hidden}
.batter{position:absolute;left:6px;right:6px;bottom:6px;height:70px;background:linear-gradient(#fbe3b0,#f3cf86);border-radius:40% 40% 10px 10px/14px 14px 10px 10px}
.minimold{width:72px;height:36px;background:linear-gradient(90deg,#90a4ae,#eceff1 40%,#b0bec5);border:3px solid #78909c;border-radius:4px 4px 10px 10px;position:relative;overflow:hidden}
.minimold::after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:20px;background:#f6d79b;border-radius:30% 30% 6px 6px}
.oven{width:310px;height:250px;background:linear-gradient(#f5f5f5,#cfcfcf);border:6px solid #9e9e9e;border-radius:20px;position:relative;box-shadow:0 8px 0 #8a8a8a}
.oven .panel{height:44px;background:#6d6d6d;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:14px;padding:0 18px}
.oven .panel i{width:24px;height:24px;border-radius:50%;background:#ddd;border:3px solid #444}
.olight{margin-left:auto;width:16px;height:16px;border-radius:50%;background:#555}
.oven.on .olight{background:#ff5722;box-shadow:0 0 10px #ff5722}
.owin{position:absolute;left:28px;right:28px;top:72px;bottom:28px;border-radius:14px;background:#4e342e;border:8px solid #616161;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px}
.oven.on .owin{background:radial-gradient(circle at 50% 40%,#ffcc80,#ff8f00 60%,#bf360c)}
.owin.open{background:#3e2723;border-style:dashed}
.rack{position:absolute;left:0;right:0;bottom:14px;height:6px;background:#9e9e9e}
.glass{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%);z-index:2}
.handle{position:absolute;left:60px;right:60px;top:54px;height:12px;border-radius:6px;background:#424242}
.omold{width:150px;height:56px;background:linear-gradient(90deg,#90a4ae,#eceff1 40%,#b0bec5);border:3px solid #78909c;border-radius:6px 6px 12px 12px;position:relative;z-index:1}
.obatter{position:absolute;left:4px;right:4px;bottom:4px;border-radius:45% 45% 8px 8px/20px 20px 8px 8px}
.cakewrap{position:relative;width:330px;height:300px}
.stand{position:absolute;left:0;right:0;bottom:8px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff,#e3e3e3);box-shadow:0 6px 0 #cfc6bb}
.cake{position:absolute;left:25px;width:280px;bottom:30px;height:140px}
.sponge{position:absolute;inset:0;background:linear-gradient(#f2c272,#d89a45);border-radius:0 0 50% 50%/0 0 24px 24px}
.ctop{position:absolute;left:0;right:0;top:-24px;height:48px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fbe0a6,#f0c06a)}
.creamlayer{position:absolute;left:0;right:0;top:-24px;bottom:0}
.creamlayer .ctop{top:0;background:radial-gradient(circle at 50% 40%,#fff,#fbf4ea)}
.cfront{position:absolute;left:0;right:0;top:24px;bottom:0;background:linear-gradient(#fffdf8,#f1e6d8);border-radius:0 0 50% 50%/0 0 24px 24px}
.piping{position:absolute;left:-6px;right:-6px;top:14px;height:18px;background:radial-gradient(circle at 9px 9px,#f8a5c2 7px,transparent 8px) 0 0/18px 18px repeat-x;z-index:1}
.cake-text{position:absolute;left:0;right:0;top:52px;text-align:center;font-size:38px;font-weight:900;color:#e0457b;text-shadow:2px 2px 0 #fff;letter-spacing:4px;z-index:1}
.deco{position:absolute;font-size:46px;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));pointer-events:none;z-index:2}
.candle{position:absolute;width:13px;height:54px;transform:translate(-50%,-100%);background:repeating-linear-gradient(45deg,#ff8fab 0 6px,#fff 6px 12px);border-radius:4px;z-index:3;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.candle::before{content:"";position:absolute;left:50%;top:-7px;width:2px;height:8px;margin-left:-1px;background:#333}
.flame{position:absolute;left:50%;top:-30px;width:16px;height:24px;margin-left:-8px;border-radius:50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff59d,#ffb300 50%,#ff6d00);box-shadow:0 0 18px 7px rgba(255,200,0,.55);animation:flick .2s infinite alternate;transform-origin:50% 100%}
.smoke{position:absolute;left:-12px;top:-46px;font-size:24px;animation:steam 1.4s forwards}
.minicandle{width:14px;height:52px;background:repeating-linear-gradient(45deg,#ff8fab 0 6px,#fff 6px 12px);border-radius:4px;margin:0 auto}
.note{position:absolute;font-size:34px;animation:rise 2.2s ease-out infinite;opacity:0;z-index:4}
.tray .done-btn{margin:0 0 0 12px;font-size:26px;padding:14px 26px;min-width:auto;animation:none;background:#5fc98a;box-shadow:0 7px 0 #3a9e63;align-self:center}
.tray{flex-wrap:wrap}
header,.screen{position:relative;z-index:1}
body.dark::before{content:"";position:fixed;inset:0;background:rgba(25,15,45,.62);pointer-events:none;z-index:0}
body.dark .hint{color:#fff59d;text-shadow:0 2px 4px #000}
body.dark .cakewrap{filter:drop-shadow(0 0 30px rgba(255,200,80,.55))}
.cslice{position:absolute;left:50%;top:54%;width:130px;height:84px;transform:translate(-50%,-50%) skewX(-8deg);display:flex;flex-direction:column;border-radius:6px;box-shadow:0 4px 6px rgba(0,0,0,.15)}
.cs-top{height:14px;background:#fffdf8;border-radius:6px 6px 0 0}
.cs-s{flex:1;background:linear-gradient(#f6d08a,#e8b45f)}
.cs-c{height:12px;background:#fff radial-gradient(circle,#ff6f91 3px,transparent 4px) 0 0/18px 12px}
.cs-berry{position:absolute;top:-32px;left:50%;transform:translateX(-50%) skewX(8deg);font-size:38px}
#cat .hat{display:none}
#cat.bday .hat{display:inline}

/* 螢幕比較矮的時候（筆電），整個畫面縮小，讓托盤不用捲動就看得到 */
@media (max-height:800px){
  header{padding:4px 12px}
  h1{font-size:28px}
  .icon-btn{width:46px;height:46px;font-size:22px}
  .dish-name{font-size:17px}
  .say{font-size:22px;padding:7px 16px;margin:2px auto}
  .stage{height:240px}
  .stage>.ware{zoom:.7}
  .dots{font-size:20px;height:24px}
  .hint{font-size:17px;height:24px}
  .tray{min-height:100px;padding:2px}
  .tool{width:86px;height:96px}
  .tool .ico{font-size:44px;height:54px}
  .tool b{font-size:17px}
  .dial{width:74px;height:74px}
  .meter{height:36px;margin-bottom:8px}
  .action{font-size:28px;padding:10px 30px}
  #feed{height:250px}
  #feedPlate .plate{zoom:.8}
  #cat{zoom:.78}
  .cushion{width:180px;height:38px;margin-top:-28px}
  #catbox{height:240px}
  .stars{font-size:40px;margin:0}
  .msg{font-size:24px}
}
@media (max-height:620px){
  .stage{height:205px}
  .stage>.ware{zoom:.6}
  #feed{height:215px}
  #feedPlate .plate{zoom:.7}
  #cat{zoom:.66}
  #catbox{height:205px}
  .hello{font-size:22px;margin:2px 0 8px}
}
.row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.row .action{margin:0;animation:none}
.conf{position:fixed;top:-50px;font-size:34px;animation:fall 2.8s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

/* ---------- 滑鼠互動 ---------- */
.hint{text-align:center;font-size:22px;font-weight:bold;color:#e8743b;height:30px}
.stage{touch-action:none}
.tray{display:flex;gap:22px;justify-content:center;align-items:flex-end;min-height:130px;padding:6px;touch-action:none}
.tool{width:108px;height:120px;border-radius:26px;background:#fff;border:4px dashed #f0b27a;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;touch-action:none;animation:invite 1.4s infinite}
.tool .ico{font-size:58px;line-height:1.1;display:flex;align-items:center;justify-content:center;height:70px}
.tool b{font-size:20px}
.tool.still{animation:none;cursor:default;border-style:solid;opacity:.85}
@keyframes invite{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.ghost{position:fixed;z-index:50;pointer-events:none;margin:0;animation:none;transform:scale(1.15) rotate(-8deg);box-shadow:0 12px 20px rgba(0,0,0,.25);cursor:grabbing}
.ware.over>:first-child{outline:7px dashed #5fc98a;outline-offset:12px}
.minilid{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#cdd9e0 60%,#98aab4);border:4px solid #8a9ba5;position:relative}
.minilid::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;background:#5a3d2b}
.knob-ctl{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;touch-action:none}
.knob-ctl b{font-size:20px}
.dial{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#cfcfcf);border:6px solid #777;position:relative;box-shadow:0 5px 0 #555}
.dial::after{content:"";position:absolute;left:50%;top:6px;width:14px;height:36px;margin-left:-7px;background:#e53935;border-radius:7px}
.knob-ctl:not(.on) .dial{animation:invite 1.4s infinite}
#cursorTool{position:fixed;z-index:60;pointer-events:none;font-size:72px;display:none;transform:translate(-25%,-75%) rotate(10deg);transition:transform .1s}
#cursorTool.down{transform:translate(-25%,-70%) rotate(-25deg) scale(.92)}
.stage.rubbing{cursor:none}
.stage.active .ware{animation:jig .25s infinite}
@keyframes jig{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.stage.tappable{cursor:pointer}
.stage.tappable .ware>:first-child{animation:tapme 1s infinite}
@keyframes tapme{50%{outline:7px dashed #5fc98a;outline-offset:12px}}
</style>
</head>

<script>
const $ = s => document.querySelector(s);

/* ---------- 聲音 ---------- */
let voiceOn = true, ac = null;
function audio(){ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function tone(f1,f2,dur,type='sine',vol=.25,delay=0){
  const a=audio(), t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,freq,type='highpass',vol=.2){
  const a=audio(), len=a.sampleRate*dur, b=a.createBuffer(1,len,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(); s.buffer=b;
  const f=a.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  const g=a.createGain(); g.gain.value=vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const SFX = {
  pop:   ()=>tone(500,900,.12),
  crack: ()=>{ tone(1400,300,.06,'square',.1); noise(.1,2500); },
  sizzle:()=>noise(.7,3000,'highpass',.16),
  splash:()=>noise(.5,900,'lowpass',.4),
  stir:  ()=>tone(320,520,.09,'triangle',.22),
  fire:  ()=>noise(.45,500,'bandpass',.4),
  ding:  ()=>[784,988,1175,1568].forEach((f,i)=>tone(f,f*1.01,.3,'triangle',.2,i*.12)),
  sad:   ()=>tone(500,220,.6,'sawtooth',.08),
  pick:  ()=>tone(400,650,.1,'sine',.15),
  blow:  ()=>noise(.7,700,'lowpass',.55),
  meow:  ()=>{ tone(650,1050,.14,'triangle',.18); tone(1050,560,.38,'triangle',.18,.14); },
  munch: ()=>{ noise(.09,1200,'bandpass',.5); setTimeout(()=>noise(.07,900,'bandpass',.4),130); },
  purr:  ()=>{
    const a=audio(), t=a.currentTime, o=a.createOscillator(), g=a.createGain(), l=a.createOscillator(), lg=a.createGain();
    o.type='sawtooth'; o.frequency.value=55; l.frequency.value=24; lg.gain.value=.07;
    l.connect(lg).connect(g.gain); g.gain.setValueAtTime(.07,t); g.gain.linearRampToValueAtTime(0,t+1.6);
    o.connect(g).connect(a.destination); o.start(t); l.start(t); o.stop(t+1.6); l.stop(t+1.6);
  }
};
function say(text){
  if(!voiceOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[^一-鿿，。！？、…]/g,''));
  u.lang='zh-TW'; u.rate=.9; u.pitch=1.2;
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh/i.test(v.lang));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}

/* ---------- 畫圖小幫手 ---------- */
const wrap   = h => `<div class="ware">${h}</div>`;

function pan(inner='', o={}){
  return `<div class="ware"><div class="pan ${o.hot?'hot':''}">${o.oil?'<div class="oil"></div>':''}${inner}</div>${o.hot?'<div class="flames" style="right:120px">🔥🔥🔥</div>':''}</div>`;
}
const egg = (lv,x=50,y=50,cls='') => `<div class="fe ${lv} ${cls}" style="left:${x}%;top:${y}%"><div class="white"></div><div class="yolk"></div></div>`;
const bowl = (inner,sm) => `<div class="bowl ${sm?'sm':''}">${inner}</div>`;
const rawEggs = n => [[38,44],[62,57]].slice(0,n).map(p=>egg('raw',p[0],p[1],'sm')).join('');
const beaten = (m,color='#ffc93c') => `<div class="beaten" style="opacity:${m};background:${color}"></div>`;
const custard = () => `<div class="beaten set"></div>` + [[40,38],[58,45],[47,60],[63,62],[36,56]].map(p=>`<div class="scal" style="left:${p[0]}%;top:${p[1]}%"></div>`).join('');
const CURDS=[[50,50],[36,40],[63,38],[40,63],[61,63],[50,29],[28,54],[73,51],[49,73],[33,30],[68,72],[56,47],[43,48],[64,27]];
const curds = n => CURDS.slice(0,n).map((p,i)=>`<div class="curd" style="left:${p[0]}%;top:${p[1]}%;--r:${(i*47)%90-45}deg"></div>`).join('');
const BUBS=[[30,30],[60,25],[45,55],[70,60],[25,65],[50,80],[75,40],[35,45],[58,70],[20,45],[65,15],[42,20]];
function pot(o={}){
  let w='';
  if(o.water){
    w = `<div class="water">${BUBS.slice(0,o.bub||0).map((p,i)=>`<div class="bub" style="left:${p[0]}%;top:${p[1]}%;animation-delay:${(i*.23)%.9}s"></div>`).join('')}${o.inner||''}</div>`;
  }
  const steam = o.steam ? [22,45,68].map((x,i)=>`<div class="steam" style="left:${x}%;top:10%;animation-delay:${i*.6}s">💨</div>`).join('') : '';
  return `<div class="ware"><div class="pot ${o.hot?'hot':''}">${w}${o.lid?'<div class="lid"><div class="knob"></div></div>':''}${steam}</div>${o.hot?'<div class="flames" style="right:0">🔥🔥🔥</div>':''}</div>`;
}
const shells = n => [[40,44,-20],[61,57,25]].slice(0,n).map(p=>`<div class="shell" style="left:${p[0]}%;top:${p[1]}%;--r:${p[2]}deg"></div>`).join('');
function slices(t){ let s=''; for(let i=t;i<5;i++) s+=`<div class="slice" style="left:${i*20}%"></div>`; return s; }
const plate = inner => `<div class="plate">${inner}</div>`;
/* 蛋糕用的小幫手 */
let decos = [];
const DECOS = [{i:'🍓',l:'草莓'},{i:'🫐',l:'藍莓'},{i:'🍒',l:'櫻桃'},{i:'🍫',l:'巧克力'},{i:'🍬',l:'糖果'},{i:'🌸',l:'小花'}];
function mix(a,b,p){
  const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)), A=h(a), B=h(b);
  return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*p)).join(',')+')';
}
const eggs3 = n => [[36,40],[64,42],[50,66]].slice(0,n).map(p=>egg('raw',p[0],p[1],'sm')).join('');
function oven(o={}){
  const m = o.mold ? `<div class="omold"><div class="obatter" style="height:${14+(o.rise||0)*36}px;background:${mix('#fbe3b0','#d9963f',o.rise||0)}"></div></div>` : '';
  return `<div class="ware"><div class="oven ${o.on?'on':''}"><div class="panel"><i></i><i></i><span class="olight"></span></div>`+
         `${o.open?'':'<div class="handle"></div>'}<div class="owin ${o.open?'open':''}"><div class="rack"></div>${m}${o.open?'':'<div class="glass"></div>'}</div></div></div>`;
}
const CANDLES=[[14,2],[27,-9],[39,5],[50,-12],[61,5],[73,-9],[86,2]];
function cake(o={}){
  const c=o.cream||0;
  let h=`<div class="ware"><div class="cakewrap"><div class="stand"></div><div class="cake"><div class="sponge"></div><div class="ctop"></div>`;
  if(c>0) h+=`<div class="creamlayer" style="clip-path:inset(0 ${(1-c)*100}% 0 0)"><div class="cfront"></div><div class="ctop"></div></div>`;
  if(c>=1) h+=`<div class="piping"></div>`;
  if(o.text) h+=`<div class="cake-text">生日快樂</div>`;
  (o.decos||[]).forEach(d=>{ h+=`<span class="deco" style="left:${d.x}%;top:${d.y}%">${d.i}</span>`; });
  for(let i=0;i<(o.candles||0);i++){
    const p=CANDLES[i], lit=i<(o.lit||0);
    h+=`<div class="candle" style="left:${p[0]}%;top:${p[1]}px">${lit?'<div class="flame"></div>':''}${(!lit&&o.smoke)?'<div class="smoke">💨</div>':''}</div>`;
  }
  h+=`</div>`;
  if(o.notes) h+=['🎵','🎶','🎵','🎶'].map((n,i)=>`<span class="note" style="left:${[5,80,20,90][i]}%;top:${[20,30,55,60][i]}%;animation-delay:${i*.5}s">${n}</span>`).join('');
  return h+`</div></div>`;
}
/* 放裝飾：回傳在蛋糕上的位置（%），沒放在蛋糕上就回傳 null */
function cakePos(x,y){
  const c=$('#stage .cake'); if(!c) return null;
  const r=c.getBoundingClientRect();
  if(x<r.left || x>r.right || y<r.top-r.height*.2 || y>r.bottom) return null;
  return [ (x-r.left)/r.width*100, (y-r.top)/r.height*100 ];
}

/* 生日快樂歌 */
let songGain=null, songTimers=[];
function playSong(delay){
  const a=audio(); stopSong();
  songGain=a.createGain(); songGain.connect(a.destination);
  const N={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
  const mel=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
             ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
             ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
             ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
  const lineStart=[0,6,12,19], lyr=['🎵 祝你生日快樂 🎵','🎵 祝你生日快樂 🎵','🎵 祝親愛的小貓咪 生日快樂 🎵','🎵 祝你生日快樂 🎵'];
  const beat=.42, t0=a.currentTime+delay; let acc=0;
  mel.forEach(([n,b],i)=>{
    const li=lineStart.indexOf(i);
    if(li>=0) songTimers.push(setTimeout(()=>{ if(document.body.classList.contains('dark')) $('#hint').textContent=lyr[li]; },(delay+acc*beat)*1000));
    const o=a.createOscillator(), g=a.createGain(), st=t0+acc*beat, en=t0+(acc+b)*beat;
    o.type='triangle'; o.frequency.value=N[n];
    g.gain.setValueAtTime(.0001,st); g.gain.exponentialRampToValueAtTime(.28,st+.02); g.gain.exponentialRampToValueAtTime(.001,en);
    o.connect(g).connect(songGain); o.start(st); o.stop(en+.05);
    acc+=b;
  });
}
function stopSong(){
  if(songGain){ try{ songGain.disconnect(); }catch(e){} songGain=null; }
  songTimers.forEach(clearTimeout); songTimers=[];
}

const friedLv = p => p<.35?'raw':p<.7?'half':p<.9?'full':'burnt';

/* ---------- 四道菜 ---------- */
const DISHES = {
  scrambled:{
    name:'炒蛋',
    steps:[
      {type:'drag', say:'把兩顆蛋拖進碗裡', tool:{icon:'🥚',label:'蛋'}, n:2, sfx:'crack'},
      {type:'rub',  say:'用筷子在碗裡轉圈圈，攪一攪', tool:'🥢', label:'筷子', n:6, sfx:'stir'},
      {type:'knob', say:'點一下旋鈕，打開爐火', sfx:'fire'},
      {type:'drag', say:'把油倒進鍋子', tool:{icon:'🍶',label:'油'}, sfx:'sizzle'},
      {type:'drag', say:'把蛋液倒進鍋子', tool:{icon:'🥣',label:'蛋液'}, sfx:'sizzle'},
      {type:'rub',  say:'用鍋鏟翻一翻、炒一炒', tool:'🥄', label:'鍋鏟', n:6, sfx:'sizzle', need:300},
      {type:'drag', say:'炒好了！把盤子拿過來裝', tool:{icon:'🍽️',label:'盤子'}, sfx:'pop'}
    ],
    draw(s,t){
      switch(s){
        case 0: return wrap(bowl(rawEggs(t)));
        case 1: return wrap(bowl(rawEggs(2)+beaten(t/6)));
        case 2: return pan();
        case 3: return pan('',{hot:1});
        case 4: return pan('',{hot:1,oil:1});
        case 5: return pan(`<div class="liquid" style="opacity:${1-t/6}"></div>`+curds(Math.round(t/6*14)),{hot:1,oil:1});
        default: return pan(curds(14),{hot:1,oil:1});
      }
    },
    plate: () => plate(curds(14)),
    result: () => ({stars:3, msg:'香噴噴的炒蛋完成了！'})
  },

  fried:{
    name:'煎半熟蛋',
    steps:[
      {type:'knob', say:'點一下旋鈕，打開爐火', sfx:'fire'},
      {type:'drag', say:'把油倒進鍋子', tool:{icon:'🍶',label:'油'}, sfx:'sizzle'},
      {type:'drag', say:'把蛋拖進鍋子裡', tool:{icon:'🥚',label:'蛋'}, sfx:'crack'},
      {type:'timing', say:'看好喔！跑到綠色星星的時候，按起鍋！', ms:9000}
    ],
    draw(s,t,p){
      switch(s){
        case 0: return pan();
        case 1: return pan('',{hot:1});
        case 2: return pan('',{hot:1,oil:1});
        default: return pan(egg(friedLv(p)),{hot:1,oil:1});
      }
    },
    plate: lv => plate(egg(lv||'half')),
    result: p => {
      const lv = friedLv(p);
      return {

/* ---------- 遊戲流程 ---------- */
let D, did, s, t, busy=false, raf=0, curP=0;

function show(id){ document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on', e.id===id)); }
function getBest(){ try{ return JSON.parse(localStorage.eggBest||'{}'); }catch(e){ return {}; } }

function home(){
  cancelAnimationFrame(raf); busy=false; $('#cursorTool').style.display='none';
  stopSong(); document.body.classList.remove('dark');
  if(window.speechSynthesis) speechSynthesis.cancel();
  const best=getBest();
  $('#cards').innerHTML = Object.entries(DISHES).map(([id,d])=>
    `<div class="card" data-id="${id}"><div class="mini">${d.plate()}</div>${d.name}<div class="best">${best[id]?'⭐'.repeat(best[id]):'還沒煮過'}</div></div>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>start(c.dataset.id));
  show('menu');
}

function start(id){
  audio(); cancelAnimationFrame(raf);
  D=DISHES[id]; did=id; s=0; t=0; busy=false; decos=[];
  stopSong(); document.body.classList.remove('dark');
  $('#dishName').textContent = (id==='cake'?'🎂 ':'🍳 ') + D.name;
  show('cook'); step();
}

const HINTS = {
  drag:  '👆 用滑鼠按住下面的東西，拖到鍋碗上！',
  rub:   '👆 按住滑鼠，在上面轉圈圈！',
  knob:  '👆 點一下旋鈕，就會開火！',
  tap:   '👆 用滑鼠點一下！',
  wait:  '⏳ 等一下下…',
  decorate:'👆 把裝飾拖到蛋糕上，想放幾個都可以！',
  timing:''
};

function draw(p=0, bump=false){
  $('#stage').innerHTML = D.draw(s,t,p);
  const st=D.steps[s], n=st.n||1;
  $('#dots').textContent = (n>1 && st.type!=='wait' && st.type!=='timing') ? '●'.repeat(t)+'○'.repeat(n-t) : '';
  if(bump){ const w=$('#stage').firstElementChild; if(w) w.classList.add('bump'); }
}

function step(){
  const st=D.steps[s], stage=$('#stage');
  $('#say').textContent = st.say; say(st.say);
  $('#meter').style.display  = st.type==='timing' ? 'flex' : 'none';
  $('#wait').style.display   = st.type==='wait' ? 'block' : 'none';
  $('#action').style.display = st.type==='timing' ? 'block' : 'none';
  $('#hint').textContent = st.hint || HINTS[st.type] || '';
  stage.classList.toggle('rubbing', st.type==='rub');
  stage.classList.toggle('tappable', st.type==='tap');
  stage.classList.remove('active');
  rubDist=0; rubbing=false;
  if(st.type!=='rub') $('#cursorTool').style.display='none';
  document.body.classList.toggle('dark', !!st.dark);
  draw(); buildTray();
  if(st.onStart) st.onStart();
  if(st.type==='wait') runWait(st.ms);
  if(st.type==='timing') runTiming(st.ms);
}

function next(){
  s++; t=0; busy=false;
  if(s>=D.steps.length) finish(D.result()); else step();
}

/* 完成一個小動作 */
function success(){
  const st=D.steps[s], n=st.n||1;
  (SFX[st.sfx]||SFX.pop)();
  t++; draw(0,true);
  if(t>=n){ busy=true; $('#tray').innerHTML=''; $('#stage').classList.remove('tappable'); setTimeout(next,650); }
  else if(st.type==='drag') buildTray();
}

/* 下面的托盤：要拖的東西、旋鈕 */
function buildTray(){
  const st=D.steps[s], tr=$('#tray');
  if(st.type==='drag'){
    let h='';
    for(let i=t;i<(st.n||1);i++) h+=`<div class="tool"><span class="ico">${st.tool.html||st.tool.icon}</span><b>${st.tool.label}</b></div>`;
    tr.innerHTML=h;
    tr.querySelectorAll('.tool').forEach(el=>el.addEventListener('pointerdown',startDrag));
  } else if(st.type==='knob'){
    tr.innerHTML=`<div class="knob-ctl" id="knob"><div class="dial"></div><b>點我開火</b></div>`;
    $('#knob').addEventListener('pointerdown',startKnob);
  } else if(st.type==='decorate'){
    tr.innerHTML = DECOS.map(d=>`<div class="tool" data-i="${d.i}"><span class="ico">${d.i}</span><b>${d.l}</b></div>`).join('')
                 + `<button class="action done-btn" id="decoDone">✅ 加好了</button>`;
    tr.querySelectorAll('.tool').forEach(el=>el.addEventListener('pointerdown',startDrag));
    $('#decoDone').onclick=()=>{ if(busy) return; busy=true; SFX.ding(); tr.innerHTML=''; setTimeout(next,500); };
  } else if(st.type==='rub'){
    tr.innerHTML=`<div class="tool still"><span class="ico">${st.tool}</span><b>${st.label}</b></div>`;
  } else tr.innerHTML='';
}

/* 是否放在鍋子/碗上（範圍放寬一點，小朋友比較好放） */
function hitTarget(x,y){
  const w=$('#stage .ware'); if(!w) return false;
  const r=(w.firstElementChild||w).getBoundingClientRect(), m=45;
  return x>r.left-m && x<r.right+m && y>r.top-m && y<r.bottom+m;
}

/* 拖曳 */
function startDrag(e){
  if(busy) return;
  e.preventDefault(); audio();
  const src=e.currentTarget, r=src.getBoundingClientRect();
  const deco = D.steps[s].type==='decorate';
  let ox=e.clientX-r.left, oy=e.clientY-r.top, ghost;
  if(deco){
    ghost=document.createElement('span'); ghost.className='ghost deco-ghost'; ghost.textContent=src.dataset.i;
    ghost.style.fontSize='48px'; ghost.style.boxShadow='none'; ox=28; oy=30;
    ghost.style.left=e.clientX-ox+'px'; ghost.style.top=e.clientY-oy+'px';
  } else {
    ghost=src.cloneNode(true); ghost.classList.add('ghost');
    ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
  }
  const hit=(x,y)=> deco ? !!cakePos(x,y) : hitTarget(x,y);
  document.body.appendChild(ghost);
  if(!deco) src.style.visibility='hidden';
  SFX.pick();
  const move=ev=>{
    ghost.style.left=ev.clientX-ox+'px'; ghost.style.top=ev.clientY-oy+'px';
    const w=$('#stage .ware'); if(w) w.classList.toggle('over', hit(ev.clientX,ev.clientY));
  };
  const up=ev=>{
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',up);
    const w=$('#stage .ware'); if(w) w.classList.remove('over');
    if(deco && !busy && cakePos(ev.clientX,ev.clientY)){
      const p=cakePos(ev.clientX,ev.clientY);
      ghost.remove(); decos.push({i:src.dataset.i, x:p[0], y:p[1]}); SFX.pop(); draw(0,true);
    }
    else if(!deco && !busy && hitTarget(ev.clientX,ev.clientY)){ ghost.remove(); success(); }
    else {
      ghost.style.transition='left .3s, top .3s';
      ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
      setTimeout(()=>{ ghost.remove(); src.style.visibility=''; },320);
    }
  };
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
}

/* 爐火旋鈕：點一下就開火（旋鈕自己轉過去） */
function startKnob(e){
  if(busy) return;
  e.preventDefault(); audio();
  const knob=$('#knob'), dial=knob.querySelector('.dial');
  knob.classList.add('on');
  dial.style.transition='transform .35s'; dial.style.transform='rotate(180deg)';
  [0,90,180].forEach(d=>tone(1800,1500,.03,'square',.08,d/1000));
  success();
}

/* 轉圈圈 / 搓一搓 / 點一下 */
let rubbing=false, rubDist=0, lastX=0, lastY=0, sndDist=0;
(function(){
  const stage=$('#stage'), cur=$('#cursorTool');
  const cs=()=>D && $('#cook').classList.contains('on') ? D.steps[s] : null;
  const endRub=()=>{ rubbing=false; cur.classList.remove('down'); stage.classList.remove('active'); };
  stage.addEventListener('pointerdown',e=>{
    const k=cs(); if(!k || busy) return;
    audio();
    if(k.type==='tap' && hitTarget(e.clientX,e.clientY)){ success(); return; }
    if(k.type==='rub'){
      rubbing=true; lastX=e.clientX; lastY=e.clientY;
      stage.setPointerCapture(e.pointerId);
      cur.classList.add('down'); stage.classList.add('active');
    }
  });
  stage.addEventListener('pointermove',e=>{
    const k=cs();
    if(!k || k.type!=='rub'){ cur.style.display='none'; return; }
    cur.textContent=k.tool; cur.style.display='block';
    cur.style.left=e.clientX+'px'; cur.style.top=e.clientY+'px';
    if(!rubbing || busy) return;
    const d=Math.hypot(e.clientX-lastX, e.clientY-lastY);
    lastX=e.clientX; lastY=e.clientY;
    if(!hitTarget(e.clientX,e.clientY)) return;
    rubDist+=d; sndDist+=d;
    if(sndDist>170){ sndDist=0; (SFX[k.sfx]||SFX.stir)(); }
    const n=k.n||1, nt=Math.min(n, Math.floor(rubDist/(k.need||350)));
    if(nt>t){
      t=nt; draw();
      if(t>=n){ busy=true; endRub(); SFX.pop(); $('#tray').innerHTML=''; setTimeout(next,650); }
    }
  });
  stage.addEventListener('pointerup',endRub);
  stage.addEventListener('pointercancel',endRub);
  stage.addEventListener('pointerleave',()=>{ if(!rubbing) cur.style.display='none'; });
})();

function runWait(ms){
  const t0=performance.now(), bar=$('#wait>div'); let lastQ=-1;
  const loop=now=>{
    const p=Math.min(1,(now-t0)/ms);
    bar.style.width = p*100+'%';
    const q=Math.floor(p*6);
    if(q!==lastQ){ lastQ=q; draw(p); if(q%2===0 && q<6) SFX.splash(); }
    if(p<1) raf=requestAnimationFrame(loop); else { SFX.pop(); next(); }
  };
  raf=requestAnimationFrame(loop);
}

function runTiming(ms){
  const t0=performance.now(), nd=$('#needle'); let lastLv='', lastSz=0;
  const loop=now=>{
    curP=Math.min(1,(now-t0)/ms);
    nd.style.left=`calc(${curP*100}% - 4px)`;
    const lv=friedLv(curP);
    if(lv!==lastLv){ lastLv=lv; draw(curP); }
    if(now-lastSz>900){ lastSz=now; lv==='burnt'?SFX.sad():SFX.sizzle(); }
    if(curP<1) raf=requestAnimationFrame(loop);
    else { busy=true; finish(D.result(1)); }
  };
  raf=requestAnimationFrame(loop);
}

$('#action').onclick=()=>{
  const st=D.steps[s];
  if(busy || st.type!=='timing') return;
  cancelAnimationFrame(raf); busy=true; finish(D.result(curP));
};

function confetti(){
  for(let i=0;i<24;i++){
    const e=document.createElement('span');
    e.className='conf'; e.textContent=['⭐','🎉','✨','🥚','💛'][i%5];
    e.style.left=Math.random()*100+'vw'; e.style.animationDelay=Math.random()*.8+'s';
    document.body.appendChild(e); setTimeout(()=>e.remove(),3800);
  }
}

/* ---------- 餵小貓咪 ---------- */
let lastR=null, fed=false, plateDX=0, plateDY=0;
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function setCat(face, text){
  const MOOD={'🐱':'idle','😺':'smell','😸':'chew','😻':'love','😽':'happy'};
  $('#cat').dataset.mood = MOOD[face] || 'idle';
  const b=$('#bubble'); b.textContent = text||''; b.style.display = text ? 'block' : 'none';
}
function hearts(n){
  const box=$('#catbox');
  for(let i=0;i<n;i++){
    const h=document.createElement('span');
    h.className='heart'; h.textContent=['💕','💖','💗','✨','💞'][i%5];
    h.style.left=(i%2?150:10)+Math.random()*90+'px'; h.style.top=-10+Math.random()*80+'px';
    h.style.animationDelay=(i*.12)+'s';
    box.appendChild(h); setTimeout(()=>h.remove(),2400);
  }
}
function placePlate(dx,dy,scale=1,anim=false){
  plateDX=dx; plateDY=dy;
  const fp=$('#feedPlate');
  fp.style.transition = anim ? 'transform .35s' : 'none';
  fp.style.transform = `translate(${dx}px,${dy}px) scale(${scale})`;
}

function finish(r){
  busy=false; lastR=r; fed=false; show('done');
  stopSong(); document.body.classList.remove('dark');
  const fp=$('#feedPlate');
  fp.innerHTML = D.plate(r.lv);
  placePlate(0,0); fp.classList.add('wiggle'); fp.style.pointerEvents='';
  $('#cat').className = D.bday ? 'bday' : ''; setCat('🐱', D.bday ? '今天是我的生日喔～' : '肚子好餓喔～');
  $('#feedSay').textContent = D.feedSay || (D.name + '做好了！拿給小貓咪吃吧！');
  $('#feedHint').style.display='block';
  $('#result').style.display='none';
  const best=getBest(); best[did]=Math.max(best[did]||0, r.stars);
  try{ localStorage.eggBest=JSON.stringify(best); }catch(e){}
  SFX.ding();
  say($('#feedSay').textContent);
}

function catHit(x,y){
  const r=$('#cat').getBoundingClientRect(), m=50;
  return x>r.left-m && x<r.right+m && y>r.top-m && y<r.bottom+m;
}

$('#feedPlate').addEventListener('pointerdown',e=>{
  if(fed) return;
  e.preventDefault(); audio();
  const fp=$('#feedPlate'), x0=e.clientX, y0=e.clientY;
  fp.setPointerCapture(e.pointerId);
  fp.classList.remove('wiggle'); fp.classList.add('dragging');
  SFX.pick();
  let wasOver=false;
  const move=ev=>{
    placePlate(ev.clientX-x0, ev.clientY-y0, 1.05);
    const over=catHit(ev.clientX,ev.clientY);
    $('#catbox').classList.toggle('over',over);
    if(over!==wasOver){ wasOver=over; over ? (setCat('😺','喵～好香喔！'), SFX.meow()) : setCat('🐱','肚子好餓喔～'); }
  };
  const up=ev=>{
    fp.removeEventListener('pointermove',move);
    fp.removeEventListener('pointerup',up);
    fp.removeEventListener('pointercancel',up);
    fp.classList.remove('dragging');
    $('#catbox').classList.remove('over');
    if(catHit(ev.clientX,ev.clientY)) eat();
    else { placePlate(0,0,1,true); setTimeout(()=>{ if(!fed) fp.classList.add('wiggle'); },360); setCat('🐱','肚子好餓喔～'); }
  };
  fp.addEventListener('pointermove',move);
  fp.addEventListener('pointerup',up);
  fp.addEventListener('pointercancel',up);
});

async function eat(){
  fed=true;
  const fp=$('#feedPlate'), cat=$('#cat'), r=lastR;
  fp.style.pointerEvents='none';
  $('#feedHint').style.display='none';
  // 把盤子放到貓咪前面
  const pr=fp.getBoundingClientRect(), cr=$('#catbox').getBoundingClientRect();
  const tx=cr.left+cr.width/2-95, ty=cr.bottom-15;
  placePlate(plateDX+(tx-(pr.left+pr.width/2)), plateDY+(ty-(pr.top+pr.height/2)), .5, true);
  setCat('😺','開動囉！'); SFX.meow();
  await sleep(500);
  cat.classList.add('chew'); setCat('😸','嚼嚼嚼…');
  const parts=fp.querySelectorAll('.plate > *');
  for(let k=1;k<=4;k++){
    SFX.munch();
    parts.forEach(p=>{ p.style.transition='opacity .3s'; p.style.opacity=1-k/4; });
    await sleep(480);
  }
  cat.classList.remove('chew');
  const line = D.catLine ? D.catLine : r.stars>=2 ? '好好吃！謝謝你！'
             : r.lv==='burnt' ? '有點苦苦的…還是謝謝你！'
             : '軟軟的好特別！謝謝你！';
  setCat('😻', line);
  cat.classList.add('happy');
  SFX.purr(); setTimeout(SFX.meow,300); hearts(10);
  $('#feedSay').textContent = '小貓咪吃飽了，好開心！';
  say('喵～' + line);
  await sleep(1500);
  cat.classList.remove('happy');
  $('#stars').textContent = '⭐'.repeat(r.stars) + '☆'.repeat(3-r.stars);
  $('#msg').textContent = r.msg;
  $('#result').style.display='block';
  confetti();
}

/* 摸摸小貓咪 */
$('#cat').addEventListener('click',()=>{
  audio();
  if(!fed){ setCat('🐱','喵？我肚子餓了～'); SFX.meow(); return; }
  const lines = D.bday ? ['呼嚕呼嚕～','這是我最棒的生日！','喵～最喜歡你了！','蛋糕好好吃！']
                       : ['呼嚕呼嚕～','喵～最喜歡你了！','再摸摸我～','明天也要煮給我吃喔！'];
  const cat=$('#cat');
  setCat(['😻','😽','😸'][Math.random()*3|0], lines[Math.random()*lines.length|0]);
  cat.classList.remove('happy'); void cat.offsetWidth; cat.classList.add('happy');
  hearts(5); SFX.meow(); SFX.purr();
});

$('#again').onclick=()=>start(did);
$('#other').onclick=home;
$('#homeBtn').onclick=home;
$('#say').onclick=()=>say($('#say').textContent);
$('#voice').onclick=()=>{ voiceOn=!voiceOn; $('#voice').textContent=voiceOn?'🔊':'🔇'; if(!voiceOn&&window.speechSynthesis) speechSynthesis.cancel(); };
if(window.speechSynthesis) speechSynthesis.getVoices();
home();
</script>
